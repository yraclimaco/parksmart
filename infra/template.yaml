AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ParkSmart backend preparation only; deployment is gated and disabled by default.

Parameters:
  DeploymentApproved:
    Type: String
    AllowedValues: ['no', 'yes']
    Default: 'no'
    Description: Set yes only after DS3 account, allowances, and mentor approval are verified.
  BackendImageUri:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$'
    Description: Existing private ECR image pinned by digest; upload and test before creating the change set.
  LambdaRuntimeRoleName:
    Type: String
    Default: ParkSmartLambdaRuntime
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description: Existing pathless Lambda execution role in this account, managed by the mentor.
  ArtifactBucket:
    Type: String
    Default: ''
    Description: Existing PRIVATE S3 bucket; this stack never creates or makes it public.
  ReleasePrefix:
    Type: String
    Default: releases/demo
    AllowedPattern: '[a-zA-Z0-9][a-zA-Z0-9._-]*(/[a-zA-Z0-9][a-zA-Z0-9._-]*)*'
    Description: Immutable release directory containing manifest and its three checked files.
  FrontendOrigins:
    Type: String
    Default: ''
    Description: Exact comma-separated website origins; no wildcard or credentials.

Rules:
  ApprovedDeploymentRequiresBucket:
    RuleCondition: !Equals [!Ref DeploymentApproved, 'yes']
    Assertions:
      - Assert: !Not [!Equals [!Ref ArtifactBucket, '']]
        AssertDescription: ArtifactBucket must be nonempty when deployment is approved.
      - Assert: !Not [!Equals [!Ref BackendImageUri, '']]
        AssertDescription: BackendImageUri must identify an uploaded digest when deployment is approved.

Conditions:
  DeployBackend: !Equals [!Ref DeploymentApproved, 'yes']

Resources:
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Condition: DeployBackend
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1
      # FastAPI applies configured CORS so gateway and app cannot disagree.

  BackendFunction:
    Type: AWS::Serverless::Function
    Condition: DeployBackend
    Properties:
      PackageType: Image
      ImageUri: !Ref BackendImageUri
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaRuntimeRoleName}'
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 30
      EphemeralStorage:
        Size: 512
      # Mentor-approved demo uses the account shared concurrency pool.
      Environment:
        Variables:
          PARKSMART_MODEL_MODE: saved
          PARKSMART_APPROVED_MODEL: historical_average
          PARKSMART_BUNDLE_MANIFEST: !Sub 's3://${ArtifactBucket}/${ReleasePrefix}/manifest.json'
          PARKSMART_CACHE_DIR: /tmp/parksmart-serving
          PARKSMART_CORS_ORIGINS: !Ref FrontendOrigins
          # Provider throttles are per process; routing remains off until
          # provider limits are reviewed for shared-concurrency deployment.
          PARKSMART_ROUTING_PROVIDER: none
      # Existing role owns S3 read and CloudWatch permissions; this stack
      # neither creates an IAM role nor changes its policies.
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: parksmart-api-prep
      DockerBuildArgs:
        MODEL_REQUIREMENTS_FILE: .lambda-build/requirements-model.txt

  BackendLogs:
    Type: AWS::Logs::LogGroup
    Condition: DeployBackend
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BackendFunction}'
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Condition: DeployBackend
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionName:
    Condition: DeployBackend
    Value: !Ref BackendFunction
